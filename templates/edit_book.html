<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main>
      <nav>
        <a href="{{ url_for('loans') }}">Loans</a>
        <a href="{{ url_for('index') }}">Genres</a>
        <a href="{{ url_for('books') }}">Books</a>
      </nav>
      <h1>Edit book</h1>
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="flash flash-{{ category }}" role="status">{{ message }}</p>
      {% endfor %}

      <form method="post">
        <div class="form-field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" value="{{ book[1] }}" required autofocus>
        </div>

        <div class="form-field">
          <label for="author">Author</label>
          <input id="author" name="author" type="text" value="{{ book[2] }}" required>
        </div>

        <div class="form-field">
          <label for="genre_id">Genre</label>
          <select id="genre_id" name="genre_id" required>
            {% for id, name in genres %}
              <option value="{{ id }}"{% if id == book[3] %} selected{% endif %}>{{ name }}</option>
            {% endfor %}
          </select>
        </div>

        <button type="submit">Save changes</button>
        <a href="{{ url_for('books') }}">Cancel</a>
      </form>
    </main>
  </body>
</html>
