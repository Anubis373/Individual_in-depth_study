<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Genres</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main>
      <nav>
        <a href="{{ url_for('loans') }}">Loans</a>
        <a href="{{ url_for('index') }}">Genres</a>
        <a href="{{ url_for('books') }}">Books</a>
      </nav>
      <h1>Genres</h1>
      <form action="{{ url_for('add_genre') }}" method="get">
        <button type="submit">Add a genre</button>
      </form>
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <p class="flash flash-{{ category }}" role="status">{{ message }}</p>
      {% endfor %}

      {% if genres %}
        <ul>
          {% for id, name in genres %}
            <li>
              {{ name }}
              <form method="post" action="{{ url_for('delete_genre', genre_id=id) }}">
                <button type="submit">Remove</button>
              </form>
            </li>
          {% endfor %}
        </ul>
      {% else %}
        <p>No genres yet.</p>
      {% endif %}
    </main>
  </body>
</html>
